# XcodeGen spec — generates FamilySchedule.xcodeproj
#   brew install xcodegen
#   cd ~/familySchedule && xcodegen
name: FamilySchedule
options:
  bundleIdPrefix: com.linton
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "6PJ2K6XJ8C"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  FamilySchedule:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - FamilySchedule
    info:
      path: FamilySchedule/Info.plist
      properties:
        CFBundleDisplayName: Family Schedule
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FamilySchedule/FamilySchedule.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.linton.familyschedule
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.linton.familyschedule
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linton.familyschedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NextUpWidgetExtension

  NextUpWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - NextUpWidget
      - FamilySchedule/Shared
    info:
      path: NextUpWidget/Info.plist
      properties:
        CFBundleDisplayName: Next Up
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NextUpWidget/NextUpWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.linton.familyschedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linton.familyschedule.NextUpWidget
